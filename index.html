<!DOCTYPE html><html lang="zh-TW"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><title>ㄅㄠˇ ㄏㄨˋ ㄍㄨㄥ ㄓㄨˇ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;font-family:"PingFang TC","Noto Sans TC",sans-serif;overflow:hidden;background:linear-gradient(#ffd6ec,#e3d4ff 60%,#c9f0ff)}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:12px}
.scr.on{display:flex}
.btn{border:none;border-radius:28px;background:#fff;box-shadow:0 6px 0 #e7a6cf,0 8px 18px #0002;font-size:44px;min-width:96px;min-height:96px;margin:8px;padding:10px 18px;color:#7a3b8f;transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #e7a6cf}
.big{font-size:64px;min-width:140px;min-height:120px}
.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center}
.card{background:#fff9;border-radius:32px;padding:14px;margin:8px;border:4px solid #fff}
.sel{outline:8px solid #ff7bc0}
#hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:center;font-size:34px}
.bar{height:26px;width:40vw;background:#fff;border-radius:14px;overflow:hidden;border:3px solid #fff}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff9ad5,#b48cff);width:0;transition:width .4s}
#stage{display:flex;align-items:flex-end;justify-content:space-around;width:100%;flex:1;max-height:42vh;margin-top:50px}
#q{display:flex;flex-direction:column;align-items:center}
.zy{font-size:60px;color:#6b2c8a;letter-spacing:4px;writing-mode:horizontal-tb}
.emo{font-size:96px}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
@keyframes shake{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
@keyframes bob{50%{transform:translateY(-10px)}}
.spark{position:absolute;font-size:40px;pointer-events:none;animation:fly 1s forwards}
.bob{animation:bob 2s infinite}
.shake{animation:shake .4s}
#drop{position:absolute;inset:0;background:#0005;display:none;align-items:center;justify-content:center;z-index:9}
#drop.on{display:flex}
#room{position:relative;width:min(92vw,760px);height:52vh;border-radius:30px;background:linear-gradient(#ffe9f6 65%,#f6c9a8 65%);border:6px solid #fff;overflow:hidden}
#room .dec{position:absolute;width:80px;height:80px;transform:translate(-50%,-50%)}
.tone svg{width:70px;height:50px}
</style></head><body>
<!-- 1 title -->
<div id="s-title" class="scr on">
 <div class="bob" style="font-size:110px">🏰🐉</div>
 <div class="zy">ㄅㄠˇ ㄏㄨˋ ㄍㄨㄥ ㄓㄨˇ</div>
 <button class="btn big" id="b-start">▶️</button>
 <div class="row"><button class="btn" id="b-home0">🏠</button></div>
</div>
<!-- 2 choose girl & job -->
<div id="s-pick" class="scr">
 <div class="row"><button class="btn" onclick="say('選一個你喜歡的女孩')">🔊</button><div class="zy">👧?</div></div>
 <div class="row" id="girls"></div>
 <div class="row" id="jobs"></div>
 <button class="btn big" id="b-go">✅</button>
</div>
<!-- 3 play -->
<div id="s-play" class="scr" style="justify-content:flex-start">
 <div id="hud"><span id="wave">⭐</span><div class="bar"><i id="hp"></i></div><span><button class="btn" style="min-width:64px;min-height:64px;font-size:30px" id="b-dress">👗</button></span></div>
 <div id="stage"><div id="hero"></div><div id="foe" style="font-size:120px">🐉</div></div>
 <div id="q" class="card"></div>
</div>
<!-- 4 wardrobe -->
<div id="s-dress" class="scr">
 <div class="row"><div id="hero2"></div><div class="row card" id="inv" style="max-width:60vw"></div></div>
 <div class="row"><div class="row" id="colors"></div><button class="btn big" id="b-back">✅</button></div>
</div>
<!-- 5 home -->
<div id="s-home" class="scr">
 <div class="row"><button class="btn" onclick="say('點寶物，再點房間，就可以放進去喔')">🔊</button><div id="homehero" style="transform:scale(.6)"></div></div>
 <div id="room"></div>
 <div class="row card" id="shelf"></div>
 <div class="row"><button class="btn" id="b-clear">🧹</button><button class="btn" id="b-homeback">⬅️</button></div>
</div>
<!-- 6 win -->
<div id="s-win" class="scr">
 <div class="bob" style="font-size:100px">👑🎉🏰</div><div id="winhero"></div>
 <div class="row"><button class="btn big" id="b-again">🔁</button><button class="btn big" id="b-home2">🏠</button></div>
</div>
<div id="drop"><div class="card" style="text-align:center;background:#fff"><div style="font-size:60px">🎁✨</div><div id="dropitem" class="bob"></div>
<div class="row"><button class="btn big" id="b-wear">👗✅</button><button class="btn big" id="b-keep">🏠</button></div></div></div>
<script>
"use strict";
// ---------- data: 康軒首冊 L1-L6 vocabulary ----------
// [字(for TTS), 注音 body, tone 1-5, emoji, lesson]
const W=[
["貓","ㄇㄠ",1,"🐱",1],["帽","ㄇㄠ",4,"👒",1],["米","ㄇㄧ",3,"🍚",1],["包","ㄅㄠ",1,"👜",1],["跑","ㄆㄠ",3,"🏃‍♀️",1],["笛","ㄉㄧ",2,"🪈",1],
["鵝","ㄜ",2,"🦢",2],["花","ㄏㄨㄚ",1,"🌸",2],["馬","ㄇㄚ",3,"🐴",2],["豬","ㄓㄨ",1,"🐷",2],["茶","ㄔㄚ",2,"🍵",2],["五","ㄨ",3,"🖐️",2],["飛","ㄈㄟ",1,"🦋",4],
["魚","ㄩ",2,"🐟",3],["雨","ㄩ",3,"🌧️",3],["河","ㄏㄜ",2,"🏞️",3],["糖","ㄊㄤ",2,"🍬",3],["球","ㄑㄧㄡ",2,"⚽",5],["蛋","ㄉㄢ",4,"🥚",3],
["笑","ㄒㄧㄠ",4,"😊",4],["書","ㄕㄨ",1,"📚",4],["手","ㄕㄡ",3,"✋",4],["水","ㄕㄨㄟ",3,"💧",4],["山","ㄕㄢ",1,"⛰️",4],["船","ㄔㄨㄢ",2,"⛵",4],["二","ㄦ",4,"✌️",4],
["牛","ㄋㄧㄡ",2,"🐮",5],["狗","ㄍㄡ",3,"🐶",5],["羊","ㄧㄤ",2,"🐑",5],["鴨","ㄧㄚ",1,"🦆",5],["牙","ㄧㄚ",2,"🦷",5],["燈","ㄉㄥ",1,"💡",5],
["鞋","ㄒㄧㄝ",2,"👟",6],["葉","ㄧㄝ",4,"🍃",6],["雞","ㄐㄧ",1,"🐔",6],["火","ㄏㄨㄛ",3,"🔥",6],["傘","ㄙㄢ",3,"☂️",6],["蛙","ㄨㄚ",1,"🐸",6],["紅","ㄏㄨㄥ",2,"🔴",6]
];
const TM=["","","ˊ","ˇ","ˋ","˙"];
const zy=(b,t)=>t==5?"˙"+b:b+TM[t];
const TN=["","一聲","二聲","三聲","四聲","輕聲"];
// tone pictogram svgs
function toneSvg(t){const p={1:"M8 14 H62",2:"M8 42 L62 8",3:"M8 14 Q35 60 62 14",4:"M8 8 L62 42"}[t];
 return `<svg viewBox="0 0 70 50"><path d="${p}" stroke="#ff5fae" stroke-width="9" fill="none" stroke-linecap="round"/></svg>`}
// ---------- save ----------
const S=JSON.parse(localStorage.getItem("pg_save")||"null")||{girl:0,job:0,color:0,inv:[],eq:[],home:[],miss:{},lv1:0};
const save=()=>localStorage.setItem("pg_save",JSON.stringify(S));
// ---------- audio ----------
let voice=null;function pickVoice(){const v=speechSynthesis.getVoices();voice=v.find(x=>/zh[-_]TW/i.test(x.lang))||v.find(x=>/zh/i.test(x.lang))||null}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t,rate){if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="zh-TW";if(voice)u.voice=voice;u.rate=rate||.8;u.pitch=1.2;speechSynthesis.speak(u)}
let AC;function tone(f,d,type,when,vol){AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.value=f;const t=AC.currentTime+(when||0);g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d)}
const sfxYes=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,"triangle",i*.08));
const sfxSoft=()=>[392,330].forEach((f,i)=>tone(f,.3,"sine",i*.15,.12));
const sfxDrop=()=>[784,988,1175,1568,1976].forEach((f,i)=>tone(f,.3,"triangle",i*.07,.15));
// ---------- character SVG ----------
const SKIN=["#ffe0cc","#f6c9a0","#d9a27a"],HAIR=["#5a3825","#f2c14e","#2b2b3a"];
const JOBS=[{e:"👑",n:"公主",c:["#ff9ad5","#ffd1ec"]},{e:"🛡️",n:"騎士",c:["#8fb8ff","#d6e6ff"]},{e:"🪄",n:"魔法師",c:["#b48cff","#e6dbff"]},{e:"🏹",n:"弓箭手",c:["#7fdcae","#d7f8e8"]}];
const COLORS=["#ff9ad5","#b48cff","#8fb8ff","#7fdcae","#ffcf6b","#ff8f8f"];
const ITEMS={
 crown:{n:"皇冠",slot:"head",svg:`<path d="M70 38 l8 -20 l12 14 l10 -18 l10 18 l12 -14 l8 20 z" fill="#ffd34d" stroke="#e0a800" stroke-width="2"/><circle cx="100" cy="30" r="5" fill="#ff5fae"/><circle cx="82" cy="33" r="3" fill="#7fdcae"/><circle cx="118" cy="33" r="3" fill="#8fb8ff"/>`},
 tiara:{n:"髮箍",slot:"head",svg:`<path d="M66 50 Q100 22 134 50" stroke="#c7b8ff" stroke-width="6" fill="none"/><path d="M100 22 l5 10 l-5 8 l-5 -8z" fill="#9ff0ff" stroke="#fff"/><circle cx="82" cy="36" r="4" fill="#ff9ad5"/><circle cx="118" cy="36" r="4" fill="#ff9ad5"/>`},
 bow:{n:"蝴蝶結",slot:"head2",svg:`<path d="M128 40 l18 -12 v24z M128 40 l-4 -16 l14 6z" fill="#ff5fae"/><circle cx="130" cy="40" r="5" fill="#ff8fc8"/>`},
 cape:{n:"披風",slot:"back",svg:`<path d="M72 92 Q50 170 58 210 L142 210 Q150 170 128 92 z" fill="#c74bd6" opacity=".9"/><path d="M72 92 Q100 104 128 92" stroke="#ffd34d" stroke-width="5" fill="none"/>`},
 wings:{n:"翅膀",slot:"back2",svg:`<path d="M90 110 Q30 60 22 120 Q30 160 90 130z M110 110 Q170 60 178 120 Q170 160 110 130z" fill="#bff4ff" stroke="#fff" stroke-width="3" opacity=".9"/>`},
 wand:{n:"魔法棒",slot:"hand",svg:`<line x1="150" y1="150" x2="168" y2="98" stroke="#b48cff" stroke-width="5" stroke-linecap="round"/><path d="M168 80 l5 11 l12 1 l-9 8 l3 12 l-11 -6 l-11 6 l3 -12 l-9 -8 l12 -1z" fill="#ffe14d" stroke="#fff" stroke-width="2"/>`},
 shield:{n:"盾牌",slot:"hand2",svg:`<path d="M32 120 h40 v26 q0 24 -20 34 q-20 -10 -20 -34z" fill="#8fb8ff" stroke="#fff" stroke-width="4"/><path d="M52 132 l4 9 h9 l-7 6 l3 9 l-9 -5 l-9 5 l3 -9 l-7 -6 h9z" fill="#ffd34d"/>`},
 necklace:{n:"項鍊",slot:"neck",svg:`<path d="M84 92 Q100 108 116 92" stroke="#fff" stroke-width="3" fill="none"/><path d="M100 103 l6 6 l-6 7 l-6 -7z" fill="#ff5fae"/>`},
 dress:{n:"禮服",slot:"body",svg:`<path d="M78 96 L122 96 L150 200 Q100 214 50 200 z" fill="#fff" opacity=".55"/><path d="M58 186 Q100 204 142 186" stroke="#ffd34d" stroke-width="5" fill="none"/><circle cx="80" cy="170" r="4" fill="#ff9ad5"/><circle cx="100" cy="176" r="4" fill="#b48cff"/><circle cx="120" cy="170" r="4" fill="#8fb8ff"/>`},
 pet:{n:"小獨角獸",slot:"pet",svg:`<g transform="translate(150 178)"><ellipse cx="0" cy="12" rx="22" ry="14" fill="#fff" stroke="#f3c2e6" stroke-width="2"/><circle cx="16" cy="-4" r="12" fill="#fff" stroke="#f3c2e6" stroke-width="2"/><path d="M20 -15 l4 -14 l2 15z" fill="#ffd34d"/><path d="M8 -12 q-10 0 -8 14" stroke="#ff9ad5" stroke-width="5" fill="none"/><circle cx="20" cy="-5" r="2" fill="#333"/></g>`},
 kitty:{n:"小貓咪",slot:"pet",svg:`<g transform="translate(36 186)"><ellipse cx="0" cy="8" rx="18" ry="12" fill="#ffc58f"/><circle cx="0" cy="-8" r="12" fill="#ffc58f"/><path d="M-10 -16 l2 -10 l7 6z M10 -16 l-2 -10 l-7 6z" fill="#ffc58f"/><circle cx="-4" cy="-9" r="2" fill="#333"/><circle cx="4" cy="-9" r="2" fill="#333"/><circle cx="0" cy="-4" r="2" fill="#ff7bb0"/></g>`}
};
const DROP_ORDER=["tiara","wand","necklace","cape","bow","crown","wings","shield","dress","pet","kitty"];
function hero(sz){const job=JOBS[S.job],sk=SKIN[S.girl%3],hr=HAIR[S.girl%3],col=COLORS[S.color]||job.c[0],eq=S.eq;
 const L=s=>eq.filter(k=>ITEMS[k].slot.startsWith(s)).map(k=>ITEMS[k].svg).join("");
 const jobAcc={0:`<circle cx="100" cy="140" r="6" fill="#ffd34d"/>`,1:`<path d="M80 110 h40 v14 h-40z" fill="#cfd8ff" stroke="#fff" stroke-width="2"/>`,2:`<path d="M64 52 L100 2 L136 52z" fill="${col}" stroke="#fff" stroke-width="3"/><circle cx="100" cy="6" r="6" fill="#ffd34d"/>`,3:`<path d="M44 100 Q26 140 44 180" stroke="#a0622d" stroke-width="5" fill="none"/><line x1="44" y1="100" x2="44" y2="180" stroke="#fff" stroke-width="1.5"/>`}[S.job];
 return `<svg viewBox="0 0 200 220" width="${sz}" height="${sz*1.1}">
 <ellipse cx="100" cy="212" rx="60" ry="7" fill="#0001"/>
 ${L("back")}
 <path d="M66 50 Q60 110 72 120 L128 120 Q140 110 134 50z" fill="${hr}"/>
 <rect x="84" y="186" width="10" height="22" rx="4" fill="${sk}"/><rect x="106" y="186" width="10" height="22" rx="4" fill="${sk}"/>
 <ellipse cx="89" cy="210" rx="9" ry="5" fill="${job.c[0]}"/><ellipse cx="111" cy="210" rx="9" ry="5" fill="${job.c[0]}"/>
 <path d="M78 96 L122 96 L144 196 Q100 206 56 196 z" fill="${col}"/>
 <path d="M78 96 L122 96 L118 120 L82 120z" fill="${job.c[1]}"/>
 ${L("body")}
 <path d="M78 100 Q60 130 66 150" stroke="${sk}" stroke-width="10" fill="none" stroke-linecap="round"/>
 <path d="M122 100 Q140 130 148 148" stroke="${sk}" stroke-width="10" fill="none" stroke-linecap="round"/>
 <rect x="94" y="84" width="12" height="14" fill="${sk}"/>
 <circle cx="100" cy="62" r="32" fill="${sk}"/>
 <path d="M68 60 Q70 26 100 26 Q130 26 132 60 Q118 44 100 46 Q84 44 68 60z" fill="${hr}"/>
 <ellipse cx="88" cy="64" rx="5" ry="7" fill="#3b2a4a"/><ellipse cx="112" cy="64" rx="5" ry="7" fill="#3b2a4a"/>
 <circle cx="90" cy="61" r="2" fill="#fff"/><circle cx="114" cy="61" r="2" fill="#fff"/>
 <circle cx="80" cy="76" r="6" fill="#ff9ab8" opacity=".6"/><circle cx="120" cy="76" r="6" fill="#ff9ab8" opacity=".6"/>
 <path d="M92 80 Q100 87 108 80" stroke="#d0507a" stroke-width="3" fill="none" stroke-linecap="round"/>
 ${jobAcc}${L("neck")}${L("head")}${L("hand")}${L("pet")}
 </svg>`}
function itemIcon(k,sz){return `<svg viewBox="0 0 200 220" width="${sz}" height="${sz}">${ITEMS[k].svg}</svg>`}
// ---------- screens ----------
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll(".scr").forEach(s=>s.classList.remove("on"));$(id).classList.add("on")}
function renderHero(){["hero","hero2","homehero","winhero"].forEach(id=>{const e=$(id);if(e)e.innerHTML=hero(id=="hero"?Math.min(220,innerHeight*.3):200)})}
function renderPick(){
 $("girls").innerHTML=[0,1,2].map(i=>{const g=S.girl;S.girl=i;const h=`<div class="card ${g==i?'sel':''}" onclick="S.girl=${i};save();renderPick();tone(660,.15)">${hero(130)}</div>`;S.girl=g;return h}).join("");
 $("jobs").innerHTML=JOBS.map((j,i)=>`<button class="btn ${S.job==i?'sel':''}" onclick="S.job=${i};save();renderPick();say('${j.n}')">${j.e}</button>`).join("");}
$("b-start").onclick=()=>{tone(880,.1);say("選一個你喜歡的女孩，和你的職業");renderPick();show("s-pick")};
$("b-go").onclick=()=>{startLevel()};
$("b-home0").onclick=$("b-home2").onclick=()=>openHome("s-title");
$("b-again").onclick=()=>{show("s-title")};
// wardrobe
let backTo="s-play";
function renderDress(){renderHero();
 $("inv").innerHTML=S.inv.length?S.inv.map(k=>`<div class="card ${S.eq.includes(k)?'sel':''}" style="padding:4px" onclick="toggleEq('${k}')">${itemIcon(k,80)}</div>`).join(""):"<div style='font-size:60px'>🎁❔</div>";
 $("colors").innerHTML=COLORS.map((c,i)=>`<button class="btn ${S.color==i?'sel':''}" style="background:${c};min-width:70px;min-height:70px" onclick="S.color=${i};save();renderDress()"></button>`).join("");}
function toggleEq(k){const sl=ITEMS[k].slot;if(S.eq.includes(k))S.eq=S.eq.filter(x=>x!=k);else{S.eq=S.eq.filter(x=>ITEMS[x].slot!=sl);S.eq.push(k);say(ITEMS[k].n)}tone(700,.12);save();renderDress()}
$("b-dress").onclick=()=>{backTo="s-play";renderDress();show("s-dress")};
$("b-back").onclick=()=>{renderHero();show(backTo)};
// home
let homeBack="s-title",pickItem=null;
function openHome(b){homeBack=b;renderHero();renderHome();show("s-home");say("這是你的小城堡家")}
function renderHome(){
 $("room").innerHTML=`<div style="position:absolute;left:8%;top:10%;font-size:60px">🪟</div><div style="position:absolute;right:8%;top:40%;font-size:70px">🛏️</div>`+S.home.map((d,i)=>`<div class="dec" style="left:${d.x}%;top:${d.y}%" onclick="event.stopPropagation();S.home.splice(${i},1);save();renderHome()">${itemIcon(d.k,80)}</div>`).join("");
 $("shelf").innerHTML=S.inv.length?S.inv.map(k=>`<div class="card ${pickItem==k?'sel':''}" style="padding:4px" onclick="pickItem='${k}';tone(600,.1);renderHome()">${itemIcon(k,64)}</div>`).join(""):"<div style='font-size:50px'>🎁❔</div>";}
$("room").onclick=e=>{if(!pickItem)return;const r=$("room").getBoundingClientRect();S.home.push({k:pickItem,x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100});save();sfxYes();renderHome()};
$("b-clear").onclick=()=>{S.home=[];save();renderHome()};
$("b-homeback").onclick=()=>show(homeBack);
// ---------- level engine ----------
// waves: lessons 1-2, 3, 4, 5-6, then boss mixes all + missed
const WAVES=[{foe:"👺",les:[1,2],n:7},{foe:"🦇",les:[2,3],n:7},{foe:"👻",les:[3,4],n:7},{foe:"🐺",les:[5,6],n:7},{foe:"🐉",les:[1,2,3,4,5,6],n:12,boss:1}];
let wv=0,qi=0,hpv=0,queue=[],streak=0,cur=null,lock=false;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const TYPES=["tone","spell","read"];
function startLevel(){wv=0;renderHero();show("s-play");startWave()}
function startWave(){const w=WAVES[wv];qi=0;hpv=0;$("foe").textContent=w.foe;$("foe").style.fontSize=w.boss?"160px":"110px";$("wave").textContent="⭐".repeat(wv+1);upd();
 let pool=shuffle(W.filter(x=>w.les.includes(x[4])));
 // missed items from earlier (persisted) come back
 const missed=W.filter(x=>S.miss[x[0]]);
 queue=[];for(let i=0;i<w.n;i++){let it=(w.boss&&missed.length&&i%2==0)?missed[i/2%missed.length|0]:pool[i%pool.length];queue.push({w:it,t:TYPES[(i+wv)%3]})}
 say(w.boss?"大黑龍來了！我們一起打敗牠，保護公主！":"壞蛋來了！答對題目就可以打敗他！");
 setTimeout(nextQ,w.boss?2600:1800)}
function upd(){$("hp").style.width=(100-hpv/WAVES[wv].n*100)+"%"}
function nextQ(){lock=false;if(!queue.length){winWave();return}cur=queue.shift();renderQ()}
function speakWord(){say(cur.w[0],.7)}
function renderQ(){const [ch,b,t,e]=cur.w;const Q=$("q");let h="";
 const rp=`<button class="btn" onclick="speakWord()">🔊</button>`;
 if(cur.t=="tone"){ // hear -> pick tone
  h=`<div class="row">${rp}<span class="emo">${e}</span><span class="zy">${b} ❓</span></div><div class="row">`+[1,2,3,4].map(k=>`<button class="btn tone" data-a="${k}" onclick="ans(this,${k==t})"><div class="zy" style="font-size:44px">${zy(b,k)}</div>${toneSvg(k)}</button>`).join("")+`</div>`;
  setTimeout(()=>say("聽聽看，是第幾聲？"+ch,.7),200);
 }else if(cur.t=="spell"){ // see emoji+hear -> pick spelling
  let opts=[[b,t]];const alt=[1,2,3,4].filter(k=>k!=t);shuffle(alt);opts.push([b,alt[0]]);
  const o=shuffle(W.filter(x=>x[1]!=b))[0];opts.push([o[1],o[2]]);shuffle(opts);
  h=`<div class="row">${rp}<span class="emo">${e}</span></div><div class="row">`+opts.map(o=>`<button class="btn" onclick="ans(this,${o[0]==b&&o[1]==t})"><span class="zy">${zy(o[0],o[1])}</span></button>`).join("")+`</div>`;
  setTimeout(()=>say(ch,.7),200);
 }else{ // read zhuyin -> pick picture
  let opts=[cur.w];shuffle(W.filter(x=>x!=cur.w&&x[3]!=e)).slice(0,2).forEach(x=>opts.push(x));
  const sameBody=W.find(x=>x[1]==b&&x[2]!=t);if(sameBody)opts[2]=sameBody; // tone trap
  shuffle(opts);
  h=`<div class="row"><span class="zy" style="font-size:80px;background:#fff;border-radius:20px;padding:6px 20px">${zy(b,t)}</span></div><div class="row">`+opts.map(o=>`<button class="btn big" onclick="ans(this,${o==cur.w})">${o[3]}</button>`).join("")+`</div>`;
  setTimeout(()=>say("哪一個是這個注音呢？"),200);
 }
 Q.innerHTML=h;Q.style.animation="none";Q.offsetWidth;Q.style.animation="pop .4s"}
const PRAISE=["好棒！","答對了！","你好厲害！","太棒了！","哇，好聰明！"];
function sparkle(x,y,n){for(let i=0;i<n;i++){const s=document.createElement("div");s.className="spark";s.textContent=["✨","⭐","💖","🌟"][i%4];s.style.left=x+"px";s.style.top=y+"px";s.style.setProperty("--dx",(Math.random()*300-150)+"px");s.style.setProperty("--dy",(Math.random()*-300)+"px");document.body.appendChild(s);setTimeout(()=>s.remove(),1000)}}
function ans(el,ok){if(lock)return;lock=true;const r=el.getBoundingClientRect();const [ch,b,t]=cur.w;
 if(ok){sfxYes();sparkle(r.left+r.width/2,r.top,14);el.style.background="#c8ffd8";delete S.miss[ch];save();
  say(PRAISE[Math.random()*5|0]+" "+ch+"，"+TN[t]);hpv++;upd();streak++;
  const f=$("foe");f.classList.remove("shake");f.offsetWidth;f.classList.add("shake");const fr=f.getBoundingClientRect();sparkle(fr.left+fr.width/2,fr.top+fr.height/2,8);
  if(streak%3==0)setTimeout(dropTreasure,1300);else setTimeout(nextQ,1500);
 }else{sfxSoft();streak=0;S.miss[ch]=(S.miss[ch]||0)+1;save();
  // show the correct answer gently
  el.style.opacity=.4;
  $("q").innerHTML=`<div class="row"><span class="emo">${cur.w[3]}</span><span class="zy" style="font-size:90px">${zy(b,t)}</span>${toneSvg(t).replace('<svg','<svg width=120 height=90')}</div>`;
  say("沒關係！這是 "+ch+"，"+TN[t]+"。我們等一下再試一次喔");
  // re-queue later in a different format
  const nt=TYPES[(TYPES.indexOf(cur.t)+1)%3];queue.splice(Math.min(3,queue.length),0,{w:cur.w,t:nt});
  setTimeout(nextQ,3200)}}
function dropTreasure(){const k=DROP_ORDER.find(x=>!S.inv.includes(x));if(!k){nextQ();return}
 S.inv.push(k);save();sfxDrop();$("dropitem").innerHTML=itemIcon(k,200);$("drop").classList.add("on");say("哇！你得到了"+ITEMS[k].n+"！要穿上嗎？");
 $("b-wear").onclick=()=>{toggleEqSilent(k);$("drop").classList.remove("on");renderHero();nextQ()};
 $("b-keep").onclick=()=>{$("drop").classList.remove("on");nextQ()};}
function toggleEqSilent(k){const sl=ITEMS[k].slot;S.eq=S.eq.filter(x=>ITEMS[x].slot!=sl);S.eq.push(k);save()}
function winWave(){const w=WAVES[wv];$("foe").textContent="💨";sfxDrop();sparkle(innerWidth/2,innerHeight/3,24);
 if(w.boss){S.lv1=1;if(!S.inv.includes("crown"))S.inv.push("crown");save();renderHero();setTimeout(()=>{show("s-win");say("你打敗大黑龍了！公主和王國都得救了！你是最棒的小英雄！");for(let i=0;i<4;i++)setTimeout(()=>{sfxYes();sparkle(Math.random()*innerWidth,innerHeight/2,20)},i*400)},1200);return}
 say("打敗壞蛋了！繼續前進！");wv++;setTimeout(startWave,2200)}
window.addEventListener("resize",()=>{if($("s-play").classList.contains("on"))renderHero()});
renderHero();
</script></body></html>
